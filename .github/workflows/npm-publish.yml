# This workflow runs tests and publishes the package to npm when a release is created.

name: Publish package to npm

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Determine npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          release_tag="${{ github.event.release.tag_name }}"
          expected_version="${release_tag#v}"

          if [[ "$version" != "$expected_version" ]]; then
            echo "Error: package version '$version' does not match release tag '$release_tag'."
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            tag="${prerelease%%.*}"
          else
            tag="latest"
          fi

          case "$tag" in
            latest|alpha|beta|rc)
              ;;
            *)
              echo "Error: unsupported npm dist-tag '$tag' derived from version '$version'."
              exit 1
              ;;
          esac

          echo "version=$version"
          echo "tag=$tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish package to npm
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"